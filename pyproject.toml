[project]
name = "pdf-duzenle"
version = "1.0.0"
description = "PDF'teki yazıların fontunu, boyutunu, rengini değiştir; yazı ekle, sil, düzenle."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.26",
    "fonttools>=4.50",
    "flask>=3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
