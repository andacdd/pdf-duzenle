<title>PDF Düzenle</title>
<style>
  :root { --bg: #f4f5f7; --fg: #1d2129; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16181d; --fg: #e8eaee; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #16181d; --fg: #e8eaee; color-scheme: dark }
  body { background: var(--bg); color: var(--fg); padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); font-family: system-ui, sans-serif; }
  pre { white-space: pre-wrap; }
</style>
<h1>Motor testi</h1>
<pre id="out">Yükleniyor…</pre>
<img id="img" alt="">
<script type="module">
const out = document.getElementById("out");
const log = (s) => (out.textContent += "\n" + s);
try {
  const t0 = performance.now();
  const mupdf = await import("./vendor/mupdf.js");
  log("motor yüklendi: " + Math.round(performance.now() - t0) + " ms");
  const doc = new mupdf.PDFDocument();
  const page = doc.addPage([0, 0, 300, 120], 0, {}, "BT /F1 24 Tf 20 60 Td (Merhaba) Tj ET");
  doc.insertPage(-1, page);
  const p = doc.loadPage(0);
  const png = p.toPixmap(mupdf.Matrix.identity, mupdf.ColorSpace.DeviceRGB).asPNG();
  document.getElementById("img").src = URL.createObjectURL(new Blob([png], { type: "image/png" }));
  log("render tamam, png " + png.length + " bayt");
} catch (e) { log("HATA: " + (e && e.stack || e)); }
</script>
